# The compiler's own build (OPEN_DECISIONS §2f; 1.5.1b): `npkc src/npkc.npk`
# under NPK_HEAP_STATS, REPORTED on every full run -- allocated, peak_live,
# count -- and held to `ceiling` bytes of peak_live once one is set (0 reports
# only). The ceiling was set at 1.5.1b's close (2026-09-04) from the measured value with
# 2x headroom, so an 11 GiB regression fails loudly instead of freezing the
# machine -- 23,258,956,650 over a peak of 11.6 GB. 1.5.2d (2026-09-05) found
# that peak was the bindings analysis copying the whole program's slot space at
# every branch of every function; with the state sized by the function the
# compiler's own build peaks at 112,913,630 bytes (20 s where it took 242), and
# the ceiling is that with 2x headroom again, so the class of regression that
# hid for a year fails loudly the day it returns.
# Re-based 2026-11-01 (1.6.1e landing 177a; management_11's ruling of 00:57 and
# plan of 00:58) by the same rule, 2x the peak measured at that landing,
# 223,843,170 bytes: landing 176 had reached 98.98 % of the old 225,827,260, and
# the review of 176b found no retention, so what had grown was the compiler. The
# ceiling catches the class of regression above; ordinary growth is now caught
# per landing: a landing whose peak_live grows more than 1 % over its parent's
# brings its cause to management BEFORE its harness.
kind    = "self"
entry   = "src/npkc.npk"
ceiling = 447686340
expect  = "pass"
