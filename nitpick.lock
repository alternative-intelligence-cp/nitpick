# nitpick.lock — the resolved dependency graph, by exact version and content hash.
#
# This file is COMMITTED and is read by every build. `npkg build` reads it and
# never writes it; a missing or stale lock is an error, not an invitation to
# resolve (D-078). Only `npkg update` writes here, and only when a human runs it.
#
# It is empty because the compiler has no dependencies yet, and it exists anyway
# so that "a build reads the lock" is true from the first build rather than
# becoming true later.

version = 1

# No [[package]] entries. An empty array-of-tables entry would declare a package
# with no fields, which is not the same as declaring none.

